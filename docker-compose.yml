services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: truesurvey-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO dashboard
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  create-bucket:
    image: quay.io/minio/mc:latest
    container_name: truesurvey-minio-create-bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb -p local/truesurvey;
      mc anonymous set download local/truesurvey;
      exit 0;
      "

volumes:
  minio_data: